<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionnaire de Recherche - RH & IA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: #fff;
            margin: 0 auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 20px;
        }
        p.intro {
            font-size: 14px;
            color: #555;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #34495e;
        }
        input[type="text"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .radio-group label {
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        button {
            background-color: #3498db;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Questionnaire de Recherche</h2>
    <p class="intro">Dans le cadre de notre démarche de recherche en Ressources Humaines, merci de bien vouloir répondre aux questions ci-dessous. Vos réponses sont précieuses et strictement anonymes.</p>

    <form id="rhForm">
        <div class="form-group">
            <label for="nom">Nom ou Identifiant (Optionnel) :</label>
            <input type="text" id="nom" name="nom" placeholder="Votre nom...">
        </div>

        <div class="form-group">
            <label for="secteur">Secteur d'activité :</label>
            <select id="secteur" name="secteur" required>
                <option value="">Sélectionnez votre secteur...</option>
                <option value="Publique">Administration / Secteur Public</option>
                <option value="Prive">Entreprise Privée</option>
                <option value="Multinationale">Multinationale</option>
                <option value="Autre">Autre</option>
            </select>
        </div>

        <div class="form-group">
            <label>Quel est votre niveau d'utilisation des outils digitaux / IA dans vos tâches RH ?</label>
            <div class="radio-group">
                <label><input type="radio" name="niveau_ia" value="Eleve" required> Élevé (Utilisation quotidienne)</label>
                <label><input type="radio" name="niveau_ia" value="Moyen"> Moyen (Utilisation occasionnelle)</label>
                <label><input type="radio" name="niveau_ia" value="Faible"> Faible ou inexistant</label>
            </div>
        </div>

        <div class="form-group">
            <label for="remarques">Remarques ou suggestions :</label>
            <textarea id="remarques" name="remarques" rows="4" placeholder="Vos commentaires..."></textarea>
        </div>

        <button type="submit" id="submitBtn">Soumettre</button>
        <div id="message"></div>
    </form>
</div>

<script>
    // Remplacez cette URL par l'URL de votre Web App Google Apps Script si ce n'est pas déjà fait
    const scriptURL = 'VOTRE_URL_GOOGLE_APPS_SCRIPT_ICI';

    const form = document.getElementById('rhForm');
    const submitBtn = document.getElementById('submitBtn');
    const messageDiv = document.getElementById('message');

    form.addEventListener('submit', e => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.textContent = 'Envoi en cours...';

        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => {
                messageDiv.style.color = 'green';
                messageDiv.textContent = '✓ Réponse enregistrée avec succès. Merci !';
                form.reset();
                submitBtn.disabled = false;
                submitBtn.textContent = 'Soumettre';
            })
            .catch(error => {
                messageDiv.style.color = 'red';
                messageDiv.textContent = 'Erreur lors de l\'envoi. Veuillez réessayer.';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Soumettre';
                console.error('Erreur!', error.message);
            });
    });
</script>

</body>
</html>
